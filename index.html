            min-height: 100vh;
            cursor: none;

        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #ec4899, #86efac);
            background-size: 200%;
            width: 0%;
            z-index: 10001;
            animation: text-shine 5s linear infinite;
        }

        /* Custom Cursor */
        .cursor-dot, .cursor-outline {
            pointer-events: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            opacity: 1;
            transition: opacity 0.3s ease-in-out, transform 0.2s ease-in-out;
            z-index: 10001;
        }
        .cursor-dot {
            width: 10px;
            height: 10px;
            background-color: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px #ec4899, 0 0 30px #ec4899;
        }
        .cursor-outline {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            transition: all 0.1s ease-out;
        }
        .cursor-dot.hidden, .cursor-outline.hidden { opacity: 0; }
        .cursor-outline.hovered {
            transform: translate(-50%, -50%) scale(0.5);
            border-color: #86efac;
            background-color: rgba(134, 239, 172, 0.2);
        }

        /* Preloader */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 10000;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }
        #preloader.loaded { opacity: 0; visibility: hidden; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #334155;
            border-top-color: #38bdf8; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        header {
            background: linear-gradient(-45deg, #0f172a, #131c31, #0b1220, #1e293b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .gradient-text {
            background: linear-gradient(90deg, #38bdf8, #ec4899, #86efac);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; color: transparent;
            background-size: 200% auto; animation: text-shine 5s linear infinite;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.4), 0 0 25px rgba(56, 189, 248, 0.4);
        }
        @keyframes text-shine { to { background-position: 200% center; } }
        
        .card-container { perspective: 1000px; }
        .card {
            background: #1e293b; border: 1px solid #334155;
            position: relative; overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            transform-style: preserve-3d;
        }
        .card::before {
            content: '';
            position: absolute;
            left: var(--x, 50%);
            top: var(--y, 50%);
            transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 60%);
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
        }
        .card:hover::before { opacity: 1; }
        
        #dakati h2 { text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
        #software h2 { text-shadow: 0 0 12px rgba(251, 191, 36, 0.5); }
        #ai h2 { text-shadow: 0 0 12px rgba(251, 146, 60, 0.5); }
        #tutorial h2 { text-shadow: 0 0 12px rgba(244, 63, 94, 0.5); }
        #web_resources h2 { text-shadow: 0 0 12px rgba(163, 230, 53, 0.5); }

            position: relative; background: transparent; padding: 1.5rem;
            border-radius: 0.5rem; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            transform: translateZ(20px);

            position: relative; overflow: hidden; transition: filter 0.3s ease;

        }
        .action-btn:hover { filter: brightness(1.2); }
        .action-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.25), transparent);

        .action-btn:hover::before { left: 100%; }

            opacity: 0; transform: translateY(30px);

                }

        let currentLang = localStorage.getItem('language') || 'bn';
        const langBnBtn = document.getElementById('lang-bn');
        const langEnBtn = document.getElementById('lang-en');

        function updateContent(lang) {
            document.documentElement.lang = lang;
            const t = translations[lang];
            document.querySelectorAll('[data-lang-key]').forEach(el => { el.textContent = t[el.dataset.langKey] || el.textContent; });
            document.querySelectorAll('[data-lang-placeholder-key]').forEach(el => { el.placeholder = t[el.dataset.langPlaceholderKey] || el.placeholder; });
            renderDynamicContent(lang);
            langBnBtn.classList.toggle('active', lang === 'bn');
            langEnBtn.classList.toggle('active', lang === 'en');
            localStorage.setItem('language', lang);
        }

        langBnBtn.addEventListener('click', () => updateContent('bn'));
        langEnBtn.addEventListener('click', () => updateContent('en'));

        const mainContainer = document.querySelector('main .space-y-20');

        function createCard(item, color, sectionKey, lang) {
            const t = translations[lang];
            const name = t.items[item.id] || item.id;
            const isModal = item.type === 'modal';
            let buttonText;

            if (isModal) {
                if (item.id === 'dakati_collection') {
                    buttonText = t.btnOpenCollection;
                } else {
                    buttonText = t.btnVisitSite;
                }
            } else if (sectionKey === 'ai') {
                buttonText = t.btnVisitSite;
            } else {
                buttonText = t.btnDownload;
            }

            const actionButton = isModal
                ? `<button data-modal-trigger="${item.modalId}" data-section-key="${sectionKey}" data-item-id="${item.id}" class="action-btn bg-${color}-500 text-white font-bold py-3 px-4 rounded-md text-center transition-colors duration-300 w-full"> <i class="fa-solid ${item.icon} mr-2"></i> ${buttonText} </button>`
                : `<a href="${item.link}" target="_blank" class="action-btn bg-${color}-500 text-white font-bold py-3 px-4 rounded-md text-center transition-colors duration-300 w-full block"> <i class="fa-solid ${item.icon} mr-2"></i> ${buttonText} </a>`;
            const categoryTag = `<div class="absolute top-2 right-2 text-xs bg-${color}-500/20 text-${color}-300 px-2 py-1 rounded-full">${t.sections[sectionKey]}</div>`;

            return `<div class="card-container" data-name="${name.toLowerCase()}"> <div class="card rounded-lg"> ${categoryTag} <div class="card-content"> <p class="text-lg font-medium mb-4 flex-grow">${name}</p> ${actionButton} </div> </div> </div>`;
        }

        function renderDynamicContent(lang) {
            // Remove only previously generated sections to preserve the #no-results paragraph
            mainContainer.querySelectorAll('section').forEach(s => s.remove());
            const t = translations[lang];
            for (const key in contentData) {
                const sectionData = contentData[key];
                const section = document.createElement('section');
                section.id = key;
                section.className = 'reveal';
                let cardsHTML = sectionData.items.map(item => createCard(item, sectionData.color, key, lang)).join('');
                section.innerHTML = `<h2 class="text-3xl font-semibold mb-8 border-l-4 border-${sectionData.color}-400 pl-4 text-white flex justify-between items-center"> ${t.sections[key]} <span class="text-lg font-normal text-slate-400 bg-slate-700/50 px-3 py-1 rounded-full">${sectionData.items.length}</span> </h2> <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"> ${cardsHTML} </div>`;
                mainContainer.appendChild(section);
            }
            addEventListeners();
        }

        function addEventListeners() {
            const revealElements = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); revealObserver.unobserve(entry.target); } }); }, { threshold: 0.1 });
            revealElements.forEach(elem => revealObserver.observe(elem));
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect(); const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                    card.style.setProperty('--x', `${x}px`); card.style.setProperty('--y', `${y}px`);
                    const width = rect.width; const height = rect.height;
                    const rotateX = -1 * ((y - height / 2) / (height / 2)) * 10;
                    const rotateY = ((x - width / 2) / (width / 2)) * 10;
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
                });
                card.addEventListener('mouseleave', () => { card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)'; });
            });
            document.querySelectorAll('a, button, input[type="search"]').forEach(el => {
                el.addEventListener('mouseenter', () => cursorOutline.classList.add('hovered'));
                el.addEventListener('mouseleave', () => cursorOutline.classList.remove('hovered'));
            });
        }
        
        updateContent(currentLang);

        const preloader = document.getElementById('preloader');
        window.addEventListener('load', () => preloader.classList.add('loaded'));

        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');
        window.addEventListener('mousemove', (e) => {
            cursorDot.style.left = `${e.clientX}px`; cursorDot.style.top = `${e.clientY}px`;
            cursorOutline.style.left = `${e.clientX}px`; cursorOutline.style.top = `${e.clientY}px`;
        });
        document.body.addEventListener('mouseleave', () => { cursorDot.classList.add('hidden'); cursorOutline.classList.add('hidden'); });
        document.body.addEventListener('mouseenter', () => { cursorDot.classList.remove('hidden'); cursorOutline.classList.remove('hidden'); });
        
        const toTopBtn = document.getElementById('to-top-btn');
        window.addEventListener('scroll', () => toTopBtn.classList.toggle('show', window.scrollY > 300));
        
        const scrollProgress = document.getElementById('scroll-progress');
        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            scrollProgress.style.width = `${(scrollTop / scrollHeight) * 100}%`;
        });

        const searchBox = document.getElementById('search-box');
        const noResults = document.getElementById('no-results');
        searchBox.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            let resultsFound = false;
            document.querySelectorAll('section').forEach(section => {
                let sectionVisible = false;
                section.querySelectorAll('.card-container').forEach(card => {
                    const cardName = card.dataset.name;
                    const isMatch = cardName.includes(searchTerm);
                    card.style.display = isMatch ? '' : 'none';
                    if (isMatch) { sectionVisible = true; resultsFound = true; }
                });
                section.style.display = sectionVisible ? '' : 'none';
            });
            noResults.style.display = resultsFound ? 'none' : 'block';
        });

        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        const nestedModalContainer = document.getElementById('nested-modal-container');
        const nestedModalContent = document.getElementById('nested-modal-content');
        const nestedModalTitle = document.getElementById('nested-modal-title');
        const nestedModalBody = document.getElementById('nested-modal-body');
        const nestedModalCloseBtn = document.getElementById('nested-modal-close-btn');

        function openModal(itemData, color, lang) {
            const t = translations[lang];
            let modalHTML = '';

            if (itemData.modalId === 'dakati-modal') {
                modalContent.classList.add('max-w-4xl', 'max-h-[90vh]', 'overflow-y-auto');
                modalTitle.textContent = t.sections.dakati;

                itemData.subItemKeys.forEach(key => {
                    const sectionData = allPacksData[key];
                    let cardsHTML = sectionData.items.map(item => {
                         const name = t.items[item.id] || item.id;
                         const isNestedModal = item.type === 'modal';
                         const buttonText = isNestedModal ? t.btnVisitSite : t.btnDownload;
                         const actionButton = isNestedModal
                             ? `<button data-nested-modal-trigger='${JSON.stringify(item)}' data-color="${sectionData.color}" class="action-btn mt-auto bg-slate-600 hover:bg-${sectionData.color}-500 text-white font-bold py-2 px-4 rounded-md text-center transition-colors duration-300 w-full"> <i class="fa-solid ${item.icon} mr-2"></i> ${buttonText} </button>`
                             : `<a href="${item.link}" target="_blank" class="action-btn mt-auto bg-slate-600 hover:bg-${sectionData.color}-500 text-white font-bold py-2 px-4 rounded-md text-center transition-colors duration-300 w-full block"> <i class="fa-solid ${item.icon} mr-2"></i> ${buttonText} </a>`;
                         return `<div class="bg-slate-900/50 p-4 rounded-lg flex flex-col"> <p class="text-base font-medium mb-3 flex-grow">${name}</p> ${actionButton} </div>`;
                    }).join('');
                    
                    modalHTML += `<div class="mb-10"> <h3 class="text-2xl font-semibold mb-6 border-l-4 border-${sectionData.color}-400 pl-4 text-white">${t.sections[key]}</h3> <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${cardsHTML}</div> </div>`;
                });
                modalBody.innerHTML = modalHTML;

            } else { // For simple modals like tutorials
                modalContent.classList.remove('max-w-4xl', 'max-h-[90vh]', 'overflow-y-auto');
                modalTitle.textContent = t.items[itemData.id];
                modalBody.innerHTML = itemData.subItems.map(subItem => `<a href="${subItem.link}" target="_blank" class="action-btn block w-full text-center bg-slate-700 hover:bg-${color}-500 text-white font-bold py-3 px-4 rounded-md transition-colors duration-300"><i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>${t.items[subItem.id]}</a>`).join('');
            }
            
            modalContainer.classList.remove('hidden');
            setTimeout(() => modalContent.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeModal() {
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modalContainer.classList.add('hidden'), 300);
        }
        
        function openNestedModal(itemData, color, lang) {
            const t = translations[lang];
            nestedModalTitle.textContent = t.items[itemData.id];
            nestedModalBody.innerHTML = itemData.subItems.map(subItem => `<a href="${subItem.link}" target="_blank" class="action-btn block w-full text-center bg-slate-700 hover:bg-${color}-500 text-white font-bold py-3 px-4 rounded-md transition-colors duration-300"><i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>${t.items[subItem.id]}</a>`).join('');
            nestedModalContainer.classList.remove('hidden');
            setTimeout(() => nestedModalContent.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeNestedModal() {
            nestedModalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => nestedModalContainer.classList.add('hidden'), 300);
        }

        document.addEventListener('click', e => {
            const trigger = e.target.closest('[data-modal-trigger]');
            if (trigger) {
                const sectionKey = trigger.dataset.sectionKey; const itemId = trigger.dataset.itemId;
                const sectionData = contentData[sectionKey];
                const itemData = sectionData.items.find(it => it.id === itemId);
                if (itemData) openModal(itemData, sectionData.color, currentLang);
            }

            const nestedTrigger = e.target.closest('[data-nested-modal-trigger]');
            if (nestedTrigger) {
                const itemData = JSON.parse(nestedTrigger.dataset.nestedModalTrigger);
                const color = nestedTrigger.dataset.color;
                openNestedModal(itemData, color, currentLang);
            }
        });

        modalCloseBtn.addEventListener('click', closeModal);
        modalContainer.addEventListener('click', e => { if (e.target === modalContainer) closeModal(); });
        nestedModalCloseBtn.addEventListener('click', closeNestedModal);
        nestedModalContainer.addEventListener('click', e => { if (e.target === nestedModalContainer) closeNestedModal(); });
    });
    </script>
